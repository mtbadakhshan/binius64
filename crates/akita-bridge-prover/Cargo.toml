[package]
name = "binius-akita-bridge-prover"
version.workspace = true
edition.workspace = true
authors.workspace = true

[lints]
workspace = true

# Prover-side IOP→Akita-PCS bridge.
#
# Hosts prover channels for the three opening variants (full-open, succinct,
# claim-reduced). Shared protocol primitives and verifier channels live in
# `binius-akita-bridge`.

[dependencies]
binius-akita-bridge = { path = "../akita-bridge" }
binius-field = { path = "../field" }
binius-iop = { path = "../iop" }
binius-iop-prover = { path = "../iop-prover", default-features = false }
binius-ip-prover = { path = "../ip-prover", default-features = false }
binius-math = { path = "../math" }
binius-transcript = { path = "../transcript" }

# Upstream Akita PCS deps. Pinned to LayerZero-Labs/akita branch
# `taghi/fix/onehot-multi-chunk-overflow` (same revision as the verifier-side
# `binius-akita-bridge` crate); see that crate's Cargo.toml for rationale.
akita-config = { git = "https://github.com/LayerZero-Labs/akita.git", branch = "taghi/fix/onehot-multi-chunk-overflow", default-features = false, features = ["planner"] }
akita-prover = { git = "https://github.com/LayerZero-Labs/akita.git", branch = "taghi/fix/onehot-multi-chunk-overflow", default-features = false }
akita-scheme = { git = "https://github.com/LayerZero-Labs/akita.git", branch = "taghi/fix/onehot-multi-chunk-overflow", default-features = false }
akita-transcript = { git = "https://github.com/LayerZero-Labs/akita.git", branch = "taghi/fix/onehot-multi-chunk-overflow", default-features = false }
akita-types = { git = "https://github.com/LayerZero-Labs/akita.git", branch = "taghi/fix/onehot-multi-chunk-overflow", default-features = false }

[dev-dependencies]
binius-math = { path = "../math", features = ["test-utils"] }
binius-transcript = { path = "../transcript" }
rand.workspace = true
sha2.workspace = true
