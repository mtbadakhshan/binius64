[package]
name = "binius-prover"
version.workspace = true
edition.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
binius-core = { path = "../core" }
binius-field = { path = "../field" }
binius-hash = { path = "../hash" }
binius-iop = { path = "../iop" }
binius-iop-prover = { path = "../iop-prover", default-features = false }
binius-ip-prover = { path = "../ip-prover", default-features = false }
binius-math = { path = "../math" }
binius-spartan-frontend = { path = "../spartan-frontend" }
binius-spartan-prover = { path = "../spartan-prover", default-features = false }
binius-spartan-verifier = { path = "../spartan-verifier" }
binius-transcript = { path = "../transcript" }
binius-verifier = { path = "../verifier" }
binius-utils = { path = "../utils" }
# Optional: Akita PCS bridge (prover-side). Enabled via the `akita` feature.
binius-akita-bridge = { path = "../akita-bridge", optional = true }
binius-akita-bridge-prover = { path = "../akita-bridge-prover", optional = true }
bytemuck.workspace = true
bytes.workspace = true
derive_more.workspace = true
digest.workspace = true
either.workspace = true
getset.workspace = true
itertools.workspace = true
thiserror.workspace = true
tracing.workspace = true
rand.workspace = true

[dev-dependencies]
anyhow.workspace = true
binius-circuits = { path = "../circuits" }
binius-frontend = { path = "../frontend" }
binius-math = { path = "../math", features = ["test-utils"] }
criterion.workspace = true
proptest.workspace = true
rand = { workspace = true, features = ["thread_rng"] }
sha2.workspace = true
sha3.workspace = true

[lib]
bench = false

[[bench]]
name = "binary_merkle_tree"
harness = false

[[bench]]
name = "sumcheck"
harness = false

[[bench]]
name = "batch_quadratic_mle"
harness = false

[[bench]]
name = "and_reduction"
harness = false

[[bench]]
name = "shift_reduction"
harness = false

[[bench]]
name = "intmul"
harness = false

[[bench]]
name = "fold_words"
harness = false

[[bench]]
name = "ring_switch"
harness = false

[[bench]]
name = "vision"
harness = false

[[bench]]
name = "prodcheck"
harness = false

[[bench]]
name = "fracaddcheck"
harness = false

# Wall-clock comparison of the four Binius64 proof paths (BaseFold, Akita
# full-open, Akita succinct, Akita claim-reduced). Lives next to the matrix
# test in `tests/prove_verify_all_modes.rs` and reuses the same circuits.
[[bench]]
name = "akita_modes"
harness = false
required-features = ["akita"]

[features]
default = ["rayon"]
# `akita` enables the Akita lattice-PCS bridge in the prover API
# (`Prover::prove_akita_{succinct,claim_reduced,full_open}`).
akita = ["dep:binius-akita-bridge", "dep:binius-akita-bridge-prover", "binius-verifier/akita"]
rayon = ["binius-utils/rayon"]
