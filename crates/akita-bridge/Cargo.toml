[package]
name = "binius-akita-bridge"
version.workspace = true
edition.workspace = true
authors.workspace = true

[lints]
workspace = true

# Verifier-side IOP→Akita-PCS bridge.
#
# Hosts the parity-bridge / sumcheck primitives and the verifier-side channels
# for three opening variants: full-open, succinct (multi-point), and
# claim-reduced (single-point via claim reduction sumcheck). Prover-side
# implementations live in `binius-akita-bridge-prover`.
#
# Upstream "Akita" is the lattice PCS (formerly named Hachi); its crates are
# the `akita-*` family in the sibling `lz-hachi` workspace.

[dependencies]
# Binius-side deps
binius-field = { path = "../field" }
binius-ip = { path = "../ip" }
binius-iop = { path = "../iop" }
binius-math = { path = "../math" }
binius-transcript = { path = "../transcript" }

# Upstream Akita PCS deps. Pinned to LayerZero-Labs/akita branch
# `taghi/fix/onehot-multi-chunk-overflow`, which carries the multi-chunk
# Ajtai overflow fix that this bridge depends on (see commit
# `aa5f55c fix(onehot): tile multi-chunk Ajtai commit to prevent
# wide-accumulator overflow` upstream). The branch is sourced via a single
# git URL so all akita-* crates resolve to the same workspace revision.
akita-config = { git = "https://github.com/LayerZero-Labs/akita.git", branch = "taghi/fix/onehot-multi-chunk-overflow", default-features = false, features = ["planner"] }
akita-field = { git = "https://github.com/LayerZero-Labs/akita.git", branch = "taghi/fix/onehot-multi-chunk-overflow", default-features = false }
akita-prover = { git = "https://github.com/LayerZero-Labs/akita.git", branch = "taghi/fix/onehot-multi-chunk-overflow", default-features = false }
akita-scheme = { git = "https://github.com/LayerZero-Labs/akita.git", branch = "taghi/fix/onehot-multi-chunk-overflow", default-features = false }
akita-serialization = { git = "https://github.com/LayerZero-Labs/akita.git", branch = "taghi/fix/onehot-multi-chunk-overflow", default-features = false }
akita-setup = { git = "https://github.com/LayerZero-Labs/akita.git", branch = "taghi/fix/onehot-multi-chunk-overflow", default-features = false }
akita-transcript = { git = "https://github.com/LayerZero-Labs/akita.git", branch = "taghi/fix/onehot-multi-chunk-overflow", default-features = false }
akita-types = { git = "https://github.com/LayerZero-Labs/akita.git", branch = "taghi/fix/onehot-multi-chunk-overflow", default-features = false }

thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
akita-algebra = { git = "https://github.com/LayerZero-Labs/akita.git", branch = "taghi/fix/onehot-multi-chunk-overflow", default-features = false }
binius-math = { path = "../math", features = ["test-utils"] }
binius-transcript = { path = "../transcript" }
rand.workspace = true
sha2.workspace = true
