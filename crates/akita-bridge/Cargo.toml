[package]
name = "binius-akita-bridge"
version.workspace = true
edition.workspace = true
authors.workspace = true

[lints]
workspace = true

# Verifier-side IOP→Akita-PCS bridge.
#
# Hosts the parity-bridge / sumcheck primitives and the verifier-side channels
# for three opening variants: full-open, succinct (multi-point), and
# claim-reduced (single-point via claim reduction sumcheck). Prover-side
# implementations live in `binius-akita-bridge-prover`.
#
# Upstream "Akita" is the lattice PCS (formerly named Hachi); its crates are
# the `akita-*` family in the sibling `lz-hachi` workspace.

[dependencies]
# Binius-side deps
binius-field = { path = "../field" }
binius-ip = { path = "../ip" }
binius-iop = { path = "../iop" }
binius-math = { path = "../math" }
binius-transcript = { path = "../transcript" }

# Upstream Akita PCS deps
akita-config = { path = "../../../lz-hachi/crates/akita-config", default-features = false, features = ["planner"] }
akita-field = { path = "../../../lz-hachi/crates/akita-field", default-features = false }
akita-prover = { path = "../../../lz-hachi/crates/akita-prover", default-features = false }
akita-scheme = { path = "../../../lz-hachi/crates/akita-scheme", default-features = false }
akita-serialization = { path = "../../../lz-hachi/crates/akita-serialization", default-features = false }
akita-setup = { path = "../../../lz-hachi/crates/akita-setup", default-features = false }
akita-transcript = { path = "../../../lz-hachi/crates/akita-transcript", default-features = false }
akita-types = { path = "../../../lz-hachi/crates/akita-types", default-features = false }

thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
akita-algebra = { path = "../../../lz-hachi/crates/akita-algebra", default-features = false }
binius-math = { path = "../math", features = ["test-utils"] }
binius-transcript = { path = "../transcript" }
rand.workspace = true
sha2.workspace = true
